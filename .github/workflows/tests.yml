name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            python: "3.12"
          - name: Ubuntu 22.04
            os: ubuntu-22.04
            python: "3.10"
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            python: "3.12"
          - name: Debian 12
            os: ubuntu-latest
            container: python:3.11-bookworm
          - name: Debian 13
            os: ubuntu-latest
            container: python:3.13-trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then elevate=(); else elevate=(sudo); fi
          "${elevate[@]}" apt-get update
          "${elevate[@]}" apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libdbus-1-3 libfontconfig1 libglib2.0-bin libgssapi-krb5-2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1 libpulse0 libpipewire-0.3-common xvfb xauth
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run unit tests
        env:
          RADIOSTUDIO_DATA_DIR: ${{ runner.temp }}/radiostudio-tests/profile
          APPDATA: ${{ runner.temp }}/radiostudio-tests/appdata
          XDG_DATA_HOME: ${{ runner.temp }}/radiostudio-tests/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/radiostudio-tests/config
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q radiostudio tests
      - name: Smoke-test Linux desktop with X11
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python tests/desktop_smoke.py
      - name: Smoke-test Windows window
        if: runner.os == 'Windows'
        run: python tests/desktop_smoke.py
